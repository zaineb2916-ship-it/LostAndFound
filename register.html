
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142b45">
  <meta name="description" content="إنشاء حساب جديد في منصة المفقودات والموجودات">
  <title>إنشاء حساب | LostAndFound</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

  <header class="topbar">
    <div class="container nav-container">

      <a class="brand" href="index.html">
        <span class="brand-mark">م</span>
        <span class="brand-name">مفقودات<span>.</span></span>
      </a>

      <div class="nav-actions">

        <a href="index.html"
           class="login-link"
           data-ar="الرئيسية"
           data-en="Home">
          الرئيسية
        </a>

        <button type="button"
                class="language-btn"
                id="langBtn">
          EN
        </button>

      </div>

    </div>
  </header>

  <main class="auth-wrap">

    <section class="auth-card">

      <div class="auth-heading">

        <span class="eyebrow"
              data-ar="انضم إلى المجتمع"
              data-en="JOIN THE COMMUNITY">
          انضم إلى المجتمع
        </span>

        <h1 data-ar="إنشاء حساب جديد"
            data-en="Create your account">
          إنشاء حساب جديد
        </h1>

        <p class="muted"
           data-ar="أنشئ حساباً لتتمكن من نشر البلاغات ومتابعة طلبات الاسترجاع."
           data-en="Create an account to post reports and manage return requests.">
          أنشئ حساباً لتتمكن من نشر البلاغات ومتابعة طلبات الاسترجاع.
        </p>

      </div>

      <form id="registerForm">

        <div class="form-group">

          <label for="name"
                 data-ar="الاسم الكامل"
                 data-en="Full name">
            الاسم الكامل
          </label>

          <input
            id="name"
            name="name"
            type="text"
            placeholder="أدخل اسمك الكامل"
            data-ar-placeholder="أدخل اسمك الكامل"
            data-en-placeholder="Enter your full name"
            required
            maxlength="100"
            autocomplete="name">

        </div>

        <div class="form-group">

          <label for="email"
                 data-ar="البريد الإلكتروني"
                 data-en="Email address">
            البريد الإلكتروني
          </label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="example@email.com"
            required
            autocomplete="email">

        </div>

        <div class="form-group">

          <label for="password"
                 data-ar="كلمة المرور (8 أحرف على الأقل)"
                 data-en="Password (at least 8 characters)">
            كلمة المرور (8 أحرف على الأقل)
          </label>

          <input
            id="password"
            name="password"
            type="password"
            minlength="8"
            required
            autocomplete="new-password">

          <span class="muted"
                data-ar="استخدمي كلمة مرور يصعب تخمينها."
                data-en="Choose a password that is difficult to guess.">
            استخدمي كلمة مرور يصعب تخمينها.
          </span>

        </div>

        <button
          class="btn btn-gold btn-full"
          type="submit"
          data-ar="إنشاء الحساب"
          data-en="Create account">
          إنشاء الحساب
        </button>

        <p id="formMessage"
           class="form-message"
           role="status"
           aria-live="polite">
        </p>

      </form>

      <div class="auth-switch">

        <span data-ar="لديك حساب بالفعل؟"
              data-en="Already have an account?">
          لديك حساب بالفعل؟
        </span>

        <a href="login.html"
           data-ar="تسجيل الدخول"
           data-en="Log in">
          تسجيل الدخول
        </a>

      </div>

    </section>

  </main>

  <footer class="footer">
    <div class="container footer-inner">

      <p data-ar="منصة مجتمعية للمساعدة في إعادة المفقودات إلى أصحابها."
         data-en="A community platform helping return lost items to their owners.">
        منصة مجتمعية للمساعدة في إعادة المفقودات إلى أصحابها.
      </p>

      <span class="copyright">© 2026 Lost & Found</span>

    </div>
  </footer>

  <script src="app.js"></script>

  <script>
    bindAuthForm("registerForm", "/api/register", "dashboard.html");
  </script>

</body>
</html>
