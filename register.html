<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>إنشاء حساب | LostAndFound</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">L</span> Lost<span>And</span>Found</a><a href="index.html" class="text-link" data-ar="الرئيسية" data-en="Home">الرئيسية</a><button class="lang" id="langBtn">EN</button></header><main class="auth-wrap"><section class="auth-card"><span class="eyebrow" data-ar="انضم إلى المجتمع" data-en="JOIN THE COMMUNITY">انضم إلى المجتمع</span><h1 data-ar="إنشاء حساب جديد" data-en="Create your account">إنشاء حساب جديد</h1><p class="muted" data-ar="أنشئ حساباً لتتمكن من نشر البلاغات ومتابعة طلبات الاسترجاع." data-en="Create an account to post reports and manage return requests.">أنشئ حساباً لتتمكن من نشر البلاغات ومتابعة طلبات الاسترجاع.</p><form id="registerForm"><label data-ar="الاسم الكامل" data-en="Full name">الاسم الكامل</label><input name="name" required maxlength="100" autocomplete="name"><label>Email</label><input name="email" type="email" required autocomplete="email"><label data-ar="كلمة المرور (8 أحرف على الأقل)" data-en="Password (at least 8 characters)">كلمة المرور (8 أحرف على الأقل)</label><input name="password" type="password" minlength="8" required autocomplete="new-password"><button class="btn btn-gold btn-full" type="submit" data-ar="إنشاء الحساب" data-en="Create account">إنشاء الحساب</button><p id="formMessage" class="form-message" role="status"></p></form><p class="auth-switch"><span data-ar="لديك حساب بالفعل؟" data-en="Already have an account?">لديك حساب بالفعل؟</span> <a href="login.html" data-ar="تسجيل الدخول" data-en="Log in">تسجيل الدخول</a></p></section></main><script src="app.js"></script><script>bindAuthForm("registerForm","/api/register","dashboard.html");</script></body></html>
