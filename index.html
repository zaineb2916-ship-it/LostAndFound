
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LostAndFound | المفقودات والموجودات</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f6fb;
            color: #243247;
            text-align: center;
        }
        header {
            background: #174b82;
            color: white;
            padding: 35px 15px;
        }
        header h1 { margin: 0 0 12px; }
        main {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        button {
            background: #174b82;
            color: white;
            border: 0;
            padding: 13px 22px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #10365e; }
        footer { margin-top: 45px; color: #667; }
    </style>
</head>
<body>
    <header>
        <h1>LostAndFound</h1>
        <p>منصة المفقودات والموجودات</p>
    </header>

    <main>
        <div class="card">
            <h2>مرحباً بك في منصتنا</h2>
            <p>
                منصة تساعدك في الإبلاغ عن الأغراض المفقودة
                والعثور على الأغراض التي تم العثور عليها.
            </p>

            <div class="actions">
                <button onclick="alert('سيتم تفعيل هذه الخدمة قريباً')">
                    أبلغ عن غرض مفقود
                </button>
                <button onclick="alert('سيتم تفعيل هذه الخدمة قريباً')">
                    أبلغ عن غرض موجود
                </button>
            </div>
        </div>
    </main>

    <footer>
        <p>LostAndFound © 2026</p>
    </footer>
</body>
</html>
